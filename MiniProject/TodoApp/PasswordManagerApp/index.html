<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white p-4">

                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="fw-bold">
                            <i class="bi bi-lock-fill"></i>
                            Password Manager
                        </h2>

                        <p class="mb-0">
                            Store your website credentials securely
                        </p>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="hideAll">
                        <label class="form-check-label">Hide Password</label>
                    </div>

                </div>

            </div>

            <div class="card-body p-4">

                <div class="row mb-4">

                    <div class="col-md-8">
                        <input type="text" id="search"
                            class="form-control"
                            placeholder="Search websites...">
                    </div>

                    <div class="col-md-4 mt-2 mt-md-0">

                        <button class="btn btn-primary w-100"
                            data-bs-toggle="modal"
                            data-bs-target="#passwordModal"
                            onclick="resetForm()">

                            <i class="bi bi-plus-lg"></i>
                            Add Password

                        </button>

                    </div>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>Website</th>
                                <th>Username / Email</th>
                                <th>Password</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="passwordList"></tbody>

                    </table>

                </div>

                <p id="emptyMessage" class="text-center text-secondary d-none">
                    No passwords found.
                </p>

            </div>
        </div>
    </div>


    <div class="modal fade" id="passwordModal">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header bg-primary text-white">

                    <h5 class="modal-title" id="modalTitle">
                        Add Password
                    </h5>

                    <button class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <div class="mb-3">
                        <label class="form-label">Website</label>

                        <input type="text" id="website"
                            class="form-control"
                            placeholder="e.g. GitHub">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username / Email</label>

                        <input type="text" id="username"
                            class="form-control"
                            placeholder="Enter username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <input type="password" id="password"
                            class="form-control"
                            placeholder="Enter password">
                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-primary" onclick="savePassword()">
                        Save Password
                    </button>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
